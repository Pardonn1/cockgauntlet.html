function reset(){
  score=0; collected=0; state='playing';
  resetLevel(1);
}

const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

function jump(){
  if(state==='playing'&&player.jumps<2){
    player.vy=-560; player.jumps++; player.ground=false;
    burst(player.x+16,player.y+54,'#b9dfed',7);
  }
}

function attack(){
  if(state==='playing'&&player.attack<=0){
    player.attack=.46; player.attackFace=player.face;
    burst(player.x+(player.face>0?36:-4),player.y+24,'#eef8ff',5);
  }
}

addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','Space','KeyW','KeyA','KeyD','KeyE','KeyR'].includes(e.code)) e.preventDefault();
  if(!e.repeat){
    if(['KeyW','ArrowUp','Space'].includes(e.code)) jump();
    if(e.code==='KeyE') attack();
    if(e.code==='KeyR') reset();
  }
  keys.add(e.code);
});
addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('blur',()=>{keys.clear();last=0;});
document.addEventListener('visibilitychange',()=>{keys.clear();last=0;});
document.getElementById('restart').onclick=()=>{reset();canvas.focus();};
canvas.onclick=()=>canvas.focus();

function burst(x,y,color,n){
  for(let i=0;i<n;i++) particles.push({x,y,vx:(Math.random()-.5)*220,vy:-70-Math.random()*160,t:.6,color});
}

function damage(){
  if(player.inv>0||state!=='playing') return;
  lives--;
  burst(player.x+16,Math.min(player.y+25,480),'#eeb27c',18);
  if(lives<=0){ state='lost'; return; }
  player.x=checkpoint; player.y=390; player.vx=player.vy=0; player.jumps=0; player.attack=0; player.inv=1.8;
}

function update(dt){
  clockTime+=dt;
  for(const p of particles){
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=450*dt; p.t-=dt;
  }
  particles=particles.filter(p=>p.t>0);
  if(state!=='playing') return;

  player.inv=Math.max(0,player.inv-dt);
  player.attack=Math.max(0,player.attack-dt);
  
  let move=Number(keys.has('KeyD')||keys.has('ArrowRight'))-Number(keys.has('KeyA')||keys.has('ArrowLeft'));
  player.vx=move*260;
  if(move&&player.attack<=0) player.face=move;

  player.x+=player.vx*dt;
  for(const s of solids) if(overlap(player,s)){
    if(player.vx>0) player.x=s.x-player.w;
    else if(player.vx<0) player.x=s.x+s.w;
  }
  player.x=Math.max(0,Math.min(LENGTH-player.w,player.x));

  let oldBottom=player.y+player.h;
  player.vy+=1450*dt;
  player.y+=player.vy*dt;
  player.ground=false;
  for(const s of solids) if(overlap(player,s)){
    if(player.vy>=0&&oldBottom<=s.y+2){
      player.y=s.y-player.h; player.vy=0; player.ground=true; player.jumps=0;
    } else if(player.vy<0){
      player.y=s.y+s.h; player.vy=0;
    }
  }
  if(player.ground){
    for(const f of floors) if(player.x>=f.x+25&&player.x+player.w<=f.x+f.w-25&&player.y+player.h===f.y) checkpoint=player.x;
  } else if(player.jumps===0) player.jumps=1;

  if(player.y>H+80){ player.inv=0; damage(); }

  // Collect stars
  for(const star of stars) if(!star.taken&&overlap(player,{x:star.x-13,y:star.y-13,w:26,h:26})){
    star.taken=true; score+=100; collected++; burst(star.x,star.y,'#ffe09a',12);
  }

  // Normal enemies (knights, corn dogs, or burgers)
  for(const e of enemies){
    if(e.dead) continue;
    e.x+=e.dir*72*dt;
    if(e.x<e.a){ e.x=e.a; e.dir=1; }
    if(e.x>e.b){ e.x=e.b; e.dir=-1; }
    
    if(player.attack>0){
      let progress=1-player.attack/.46;
      const hit={x:player.attackFace>0?player.x+12:player.x-76,y:player.y-20,w:96,h:98};
      if(progress>.12&&progress<.91&&overlap(hit,e)){
        e.dead=true; score+=200; burst(e.x+14,e.y+21,'#d99283',20); continue;
      }
    }
    if(overlap(player,e)) damage();
  }

  // Boss Logic
  if(!boss.dead){
    boss.inv=Math.max(0,boss.inv-dt);
    
    if(boss.type===1){
      // Level 1 Boss patrols
      boss.x+=boss.dir*95*dt;
      if(boss.x<3450){ boss.x=3450; boss.dir=1; }
      if(boss.x>3650){ boss.x=3650; boss.dir=-1; }
      if(Math.abs(player.x-boss.x)<300) boss.dir=player.x>boss.x?1:-1;
    } else {
      // Level 2 Boss ROLLS AROUND! Fast rolling speed
      boss.rollAngle += boss.dir * 8 * dt;
      boss.x += boss.dir * 140 * dt;
      if(boss.x<3350){ boss.x=3350; boss.dir=1; }
      if(boss.x>3750){ boss.x=3750; boss.dir=-1; }
    }

    // Check sword hit on boss
    if(player.attack>0){
      let progress=1-player.attack/.46;
      const hit={x:player.attackFace>0?player.x+12:player.x-76,y:player.y-20,w:96,h:98};
      if(progress>.12&&progress<.91&&overlap(hit,boss)&&boss.inv<=0){
        boss.health--;
        boss.inv=0.7;
        burst(boss.x+36,boss.y+44,'#99ffcc',25);
        if(boss.health<=0){
          boss.dead=true;
          score+=1000;
          burst(boss.x+36,boss.y+44,'#ffdf70',50);
        }
      }
    }
    if(overlap(player,boss)) damage();
  }

  // Reach goal after boss defeated
  if(boss.dead&&player.x+player.w>3820&&player.y+player.h>350&&state==='playing'){
    if(level===1){
      // Advance to Level 2!
      burst(3860,350,'#ffe09a',50);
      resetLevel(2);
    } else {
      // Win Game!
      state='won';
      burst(3860,350,'#ffe09a',50);
    }
  }

  camera=Math.max(0,Math.min(LENGTH-W,player.x-W*.34));
}

function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}

function starShape(x,y,r,color){
  ctx.beginPath();
  for(let i=0;i<10;i++){
    let a=-Math.PI/2+i*Math.PI/5, rad=i%2?r*.44:r;
    ctx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad);
  }
  ctx.closePath(); ctx.fillStyle=color; ctx.fill();
}

// Enhanced Knight Rendering
function knight(x,y,enemy,face,walk){
  ctx.save();
  ctx.translate(x+16,y);
  ctx.scale(face,1);
  let scale=enemy?.78:1;
  ctx.scale(scale,scale);
  const bob=walk?Math.sin(clockTime*14)*3.5:0;
  
  if(!enemy){
    ctx.fillStyle='#2b4a78';
    ctx.beginPath();
    ctx.moveTo(-10,14+bob); ctx.lineTo(-24,30+bob); ctx.lineTo(-18,52+bob); ctx.lineTo(-4,48+bob); ctx.closePath();
    ctx.fill();
  }

  rect(-13,38,11,16,enemy?'#662233':'#182e4a');
  rect(2,38,11,16,enemy?'#662233':'#182e4a');
  rect(-14,50,13,4,enemy?'#441122':'#0d1726');
  rect(1,50,13,4,enemy?'#441122':'#0d1726');
  
  rect(-12,24,10,16,enemy?'#555d6e':'#8da4bc');
  rect(2,24,10,16,enemy?'#555d6e':'#8da4bc');

  rect(-14,14,28,24,enemy?'#4a4f5c':'#486b8c');
  rect(-9,17,18,16,enemy?'#7a2c3a':'#d4af37');
  rect(-6,20,12,10,enemy?'#551f28':'#b8972e');

  ctx.fillStyle=enemy?'#6b7385':'#7aa2c7';
  ctx.beginPath(); ctx.arc(-13,15,7,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(13,15,7,0,Math.PI*2); ctx.fill();

  rect(-19,18+bob*.5,7,16,enemy?'#4a4f5c':'#5f7f9e');
  rect(12,18-bob*.5,7,16,enemy?'#4a4f5c':'#5f7f9e');

  rect(-12,-6,24,22,enemy?'#737a8a':'#a8c2db');
  rect(-14,-8,28,5,enemy?'#555c6b':'#85a3c0');
  ctx.fillStyle=enemy?'#cc3344':'#e63946';
  ctx.beginPath(); ctx.moveTo(-4,-8); ctx.lineTo(-12,-20); ctx.lineTo(2,-8); ctx.closePath(); ctx.fill();

  rect(-9,1,18,5,enemy?'#383d47':'#1b2d3d');
  rect(-5,2,10,2,enemy?'#ff5544':'#51e2f5');
  rect(-3,-4,6,3,enemy?'#993344':'#f3c653');

  ctx.restore();
}

// Draw Realistic Corn Dog Enemy (plump golden batter, crispy fried crust texture, wooden stick)
function corndog(e){
  ctx.save();
  ctx.translate(e.x+18, e.y+18);
  const wiggle = Math.sin(clockTime*12)*3;
  ctx.rotate(wiggle * 0.05);
  
  // Wooden stick protruding bottom
  ctx.fillStyle = '#c8965c';
  ctx.fillRect(-2, 4, 4, 20);

  // Plump golden-brown corn dog batter oval
  ctx.fillStyle = '#e69522';
  ctx.beginPath();
  ctx.ellipse(0, -2, 14, 16, 0, 0, Math.PI*2);
  ctx.fill();
  
  // Crispy fried highlight / shading lines
  ctx.strokeStyle = '#a85c10';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, -2, 11, 0.2, Math.PI - 0.2);
  ctx.stroke();

  ctx.restore();
}

// Draw Burger Enemy (Bun top with sesame seeds, lettuce, cheese, beef patty, bun bottom)
function burger(e){
  ctx.save();
  ctx.translate(e.x+19, e.y+18);
  const bounce = Math.sin(clockTime*15)*2;
  ctx.translate(0, bounce);

  // Bottom Bun
  ctx.fillStyle = '#d49b48';
  ctx.beginPath();
  ctx.ellipse(0, 10, 16, 6, 0, 0, Math.PI*2);
  ctx.fill();

  // Beef Patty
  ctx.fillStyle = '#5c3822';
  ctx.fillRect(-16, 4, 32, 6);

  // Cheese slice hanging out
  ctx.fillStyle = '#f4b82a';
  ctx.beginPath();
  ctx.moveTo(8, 6); ctx.lineTo(14, 10); ctx.lineTo(4, 10); ctx.closePath();
  ctx.fill();

  // Lettuce wavy layer
  ctx.fillStyle = '#38b000';
  ctx.beginPath();
  ctx.moveTo(-16, 2);
  ctx.bezierCurveTo(-8, -2, 0, 6, 8, 2);
  ctx.bezierCurveTo(12, 0, 16, 4, 18, 2);
  ctx.lineTo(-16, 2);
  ctx.fill();

  // Top Bun
  ctx.fillStyle = '#e5a952';
  ctx.beginPath();
  ctx.arc(0, -2, 16, Math.PI, 0, false);
  ctx.fill();

  // Sesame seeds on top bun
  ctx.fillStyle = '#fff3d1';
  ctx.fillRect(-6, -8, 3, 2);
  ctx.fillRect(4, -10, 3, 2);
  ctx.fillRect(0, -13, 3, 2);

  ctx.restore();
}

// Boss 1 Photo
function drawBossPhoto1(b){
  ctx.save();
  ctx.translate(b.x, b.y);
  if(bossImg1.complete && bossImg1.naturalWidth !== 0){
    ctx.drawImage(bossImg1, 0, 0, b.w, b.h);
  } else {
    ctx.fillStyle = '#32b85a'; ctx.fillRect(0, 0, b.w, b.h);
  }
  ctx.restore();
}

// Boss 2 Photo (Rolling around)
function drawBossPhoto2(b){
  ctx.save();
  ctx.translate(b.x + b.w/2, b.y + b.h/2);
  ctx.rotate(b.rollAngle); // ROLLS AROUND!
  if(bossImg2.complete && bossImg2.naturalWidth !== 0){
    ctx.drawImage(bossImg2, -b.w/2, -b.h/2, b.w, b.h);
  } else {
    ctx.fillStyle = '#ff7b00'; ctx.fillRect(-b.w/2, -b.h/2, b.w, b.h);
  }
  ctx.restore();
}

// Freed Immigrant rendering
function freedImmigrant(x, y, i){
  ctx.save();
  const hop = Math.sin(clockTime*8 + i*1.5)*6;
  ctx.translate(x, y + hop);
  ctx.fillStyle='#f5d0b1'; ctx.beginPath(); ctx.arc(0,-16,8,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#785134'; rect(-8,-24,16,5,2);
  ctx.fillStyle = i%2===0?'#e76f51':'#2a9d8f';
  rect(-8,-8,16,20,3);
  ctx.fillStyle='#f5d0b1';
  rect(-14,-14,5,10,2);
  rect(9,-14,5,10,2);
  ctx.restore();
}

// Draw Pine Trees for Level 2 Background
function drawTrees(camera){
  ctx.save();
  for(let i=0; i<20; i++){
    let tx = i * 220 - camera * 0.4;
    if(tx > -100 && tx < W + 100){
      // Trunk
      ctx.fillStyle = '#5c4033';
      ctx.fillRect(tx + 22, 340, 16, 120);
      // Pine foliage layers (triangles)
      ctx.fillStyle = '#1e4d2b';
      ctx.beginPath();
      ctx.moveTo(tx + 30, 200); ctx.lineTo(tx - 10, 310); ctx.lineTo(tx + 70, 310); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#265d35';
      ctx.beginPath();
      ctx.moveTo(tx + 30, 250); ctx.lineTo(tx - 20, 370); ctx.lineTo(tx + 80, 370); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#2f6d40';
      ctx.beginPath();
      ctx.moveTo(tx + 30, 300); ctx.lineTo(tx - 30, 460); ctx.lineTo(tx + 90, 460); ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore();
}

function sword(){
  let p=player;
  ctx.save();
  ctx.translate(p.x+16,p.y+26);
  ctx.scale(p.attack>0?p.attackFace:p.face,1);
  let angle=p.attack>0?-2.1+(1-p.attack/.46)*4.3:.8;
  
  if(p.attack>0){
    ctx.beginPath(); ctx.arc(0,0,73,angle-.8,angle); ctx.strokeStyle='#bbf2ff'; ctx.lineWidth=13; ctx.globalAlpha=.6; ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,59,angle-1.05,angle); ctx.strokeStyle='#ffffff'; ctx.lineWidth=4; ctx.stroke(); ctx.globalAlpha=1;
  }
  ctx.rotate(angle);
  rect(5,-3,18,6,'#5c3a21');
  rect(20,-11,5,22,'#e9c679');
  ctx.beginPath(); ctx.moveTo(25,-5); ctx.lineTo(67,-4); ctx.lineTo(79,0); ctx.lineTo(67,4); ctx.lineTo(25,5); ctx.closePath();
  ctx.fillStyle='#eef9ff'; ctx.fill();
  rect(26,-1,42,2,'#7ba6c4');
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  let sky=ctx.createLinearGradient(0,0,0,H);
  if(level===1){
    sky.addColorStop(0,'#142137'); sky.addColorStop(1,'#4c6575');
  } else {
    sky.addColorStop(0,'#2b4c7e'); sky.addColorStop(1,'#6b9ac4'); // Level 2 forest daytime sky
  }
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
  
  ctx.fillStyle='#f0ddad'; ctx.beginPath(); ctx.arc(780-camera*.04,95,32,0,Math.PI*2); ctx.fill();

  if(level===1){
    for(let i=-1;i<11;i++){
      let x=i*190-camera*.22;
      rect(x,220,145,240,'#25384a'); rect(x+12,175,44,285,'#293d50');
      for(let j=0;j<4;j++) rect(x+j*38,207,22,22,'#25384a');
      rect(x+27,210,12,35,'#101d30');
    }
  } else {
    // Draw trees in level 2 background
    drawTrees(camera);
  }

  ctx.save();
  ctx.translate(-camera,0);
  
  for(const s of solids){
    rect(s.x,s.y,s.w,s.h,level===1?'#526375':'#3d6348');
    rect(s.x,s.y,s.w,6,level===1?'#a0a79d':'#73a882');
    ctx.strokeStyle=level===1?'#35475a':'#25422e'; ctx.lineWidth=2;
    for(let yy=s.y+24;yy<s.y+s.h;yy+=24){ ctx.beginPath(); ctx.moveTo(s.x,yy); ctx.lineTo(s.x+s.w,yy); ctx.stroke(); }
    for(let xx=s.x+35;xx<s.x+s.w;xx+=55){ ctx.beginPath(); ctx.moveTo(xx,s.y+6); ctx.lineTo(xx,s.y+s.h); ctx.stroke(); }
  }

  // Draw Cages (Level 1 only)
  if(level===1){
    for(let i=0; i<cages.length; i++){
      let c = cages[i];
      rect(c.x-5, c.y+c.h, c.w+10, 6, '#384454');
      
      if(!boss.dead){
        ctx.fillStyle='#1c2430'; ctx.fillRect(c.x, c.y, c.w, c.h);
        ctx.fillStyle='#445266';
        for(let bx=c.x+8; bx<c.x+c.w; bx+=12) rect(bx, c.y, 4, c.h, '#445266');
        rect(c.x, c.y, c.w, 6, '#445266');
        rect(c.x, c.y+c.h-6, c.w, 6, '#445266');
        ctx.fillStyle='#7b8c9e';
        ctx.beginPath(); ctx.arc(c.x+c.w/2, c.y+c.h-30, 10, 0, Math.PI*2); ctx.fill();
        rect(c.x+c.w/2-8, c.y+c.h-20, 16, 22, '#7b8c9e');
      } else {
        ctx.fillStyle='#111822'; ctx.fillRect(c.x, c.y, c.w, c.h);
        ctx.fillStyle='#333d4d';
        for(let bx=c.x+8; bx<c.x+c.w; bx+=12) rect(bx, c.y, 4, c.h, '#333d4d');
        rect(c.x, c.y, c.w, 6, '#333d4d');
        rect(c.x+c.w-6, c.y+15, 14, c.h-20, '#262f3d');
        
        freedImmigrant(c.x - 22 + i*75, c.y + 40, i*2);
        freedImmigrant(c.x + 12 + i*75, c.y + 42, i*2 + 1);
        freedImmigrant(c.x + 40 + i*60, c.y + 38, i*3);
      }
    }
  }

  // Large, arched finish door
  rect(3760,180,200,280,level===1?'#617283':'#5f7358');
  for(let j=0;j<5;j++) rect(3750+j*46,160,28,35,level===1?'#89949c':'#82947a');
  ctx.fillStyle='#d8b96e';
  ctx.beginPath(); ctx.moveTo(3806,460); ctx.lineTo(3806,322); ctx.arc(3860,322,54,Math.PI,0); ctx.lineTo(3914,460); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#49382e';
  ctx.beginPath(); ctx.moveTo(3816,460); ctx.lineTo(3816,324); ctx.arc(3860,324,44,Math.PI,0); ctx.lineTo(3904,460); ctx.fill();
  for(let x=3825;x<3904;x+=16) rect(x,326,3,134,'#70533b');
  rect(3816,365,88,7,'#c39e58'); rect(3816,422,88,7,'#c39e58');
  ctx.fillStyle='#ffe1a1'; ctx.font='bold 15px system-ui'; ctx.textAlign='center';
  ctx.fillText(level===1 ? (boss.dead ? 'IMMIGRANTS FREED! ENTER GATE' : 'DEFEAT BUZZ BOSS') : (boss.dead ? 'LEVEL 2 CLEARED!' : 'DEFEAT ROLLING BOSS'),3860,145);

  // Stars
  for(const s of stars) if(!s.taken) starShape(s.x,s.y+Math.sin(clockTime*3+s.x)*3,12,'#ffdb76');
  
  // Normal Enemies
  for(const e of enemies){
    if(e.dead) continue;
    if(e.type==='corndog') corndog(e);
    else if(e.type==='burger') burger(e);
    else knight(e.x,e.y,true,e.dir,true);
  }

  // Boss Photo
  if(!boss.dead){
    if(boss.type===1) drawBossPhoto1(boss);
    else drawBossPhoto2(boss); // Rolling boss

    ctx.fillStyle='rgba(10,20,36,0.85)';
    ctx.fillRect(boss.x-6,boss.y-22,84,14);
    ctx.strokeStyle='#ffda7a'; ctx.lineWidth=1; ctx.strokeRect(boss.x-6,boss.y-22,84,14);
    ctx.fillStyle='#ff5555';
    ctx.fillRect(boss.x-4,boss.y-20,80*(boss.health/boss.maxHealth),10);
    ctx.fillStyle='#fff'; ctx.font='bold 9px system-ui'; ctx.textAlign='center';
    ctx.fillText('BOSS: '+boss.health+'/4',boss.x+36,boss.y-12);
  }

  // Player & Sword
  if(player.inv<=0||Math.floor(clockTime*13)%2===0){
    knight(player.x,player.y,false,player.face,player.ground&&player.vx!==0);
    sword();
  }

  // Particles
  for(const p of particles){
    ctx.globalAlpha=Math.min(1,p.t*3);
    rect(p.x,p.y,4,4,p.color);
  }
  ctx.globalAlpha=1;
  ctx.restore();

  // HUD
  rect(18,17,924,53,'#101a2ae8');
  ctx.fillStyle='#f5e9cc'; ctx.textAlign='left'; ctx.font='bold 19px system-ui';
  ctx.fillText('SCORE  '+String(score).padStart(4,'0'),38,51);
  ctx.fillStyle='#ffda7a'; ctx.fillText('★  '+collected+' / '+stars.length,260,51);
  ctx.fillStyle='#99ffcc'; ctx.fillText('LEVEL: '+level+' / 2',430,51);
  ctx.fillStyle='#ffb703'; ctx.fillText(level===1?(boss.dead?'IMMIGRANTS: FREED!':'IMMIGRANTS: CAGED'):(boss.dead?'ROUND 2: CLEARED':'FOREST ARENA'),580,51);
  ctx.fillStyle='#f0a9a3'; ctx.fillText('LIVES  '+ '♥'.repeat(lives)+'♡'.repeat(3-lives),810,51);

  // Game Over / Win overlays
  if(state!=='playing'){
    rect(0,0,W,H,'#0a1424cf');
    ctx.textAlign='center';
    ctx.fillStyle=state==='won'?'#ffe09a':'#edb2aa';
    ctx.font='bold 51px Georgia';
    ctx.fillText(state==='won'?'Gauntlet conquered!':'Game over',W/2,220);
    ctx.fillStyle='#eef0e8'; ctx.font='21px system-ui';
    ctx.fillText(state==='won'?'congrats stupid fat man is defeated':'Your knight has fallen. Try again.',W/2,268);
    ctx.fillText('Score '+score+'  ·  Stars '+collected+' / '+stars.length,W/2,310);
    ctx.font='17px system-ui';
    ctx.fillText('Press R or choose Restart to play again',W/2,360);
  }
}

function frame(t){
  if(!last) last=t;
  accumulator+=Math.min((t-last)/1000,.05);
  last=t;
  while(accumulator>=1/120){ update(1/120); accumulator-=1/120; }
  draw();
  requestAnimationFrame(frame);
}

reset();
requestAnimationFrame(frame);
</script></body></html>
